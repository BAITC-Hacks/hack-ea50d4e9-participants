services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careerquest}
      POSTGRES_USER: ${POSTGRES_USER:-careerquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careerquest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-careerquest}:${POSTGRES_PASSWORD:-careerquest}@db:5432/${POSTGRES_DB:-careerquest}
      DEMO_MODE: ${DEMO_MODE:-true}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.3-70b-instruct}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-7.5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

volumes:
  postgres_data:
